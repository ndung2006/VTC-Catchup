# VTCCatchup cho Coolify (Ubuntu 24.04) — file compose ĐỘC LẬP, dùng thay
# docker-compose.yml khi deploy qua Coolify (New Resource → Docker Compose).
#
# Khác biệt so với bản thường (lý do trong docs/12-YEU-CAU-HE-THONG.md §6):
#  - Bỏ `ports: ["80:80"]` của nginx: Coolify (Traefik) đã chiếm 80/443.
#    Gán domain cho service `nginx` trong UI Coolify, SSL tự động.
#  - Backend giữ `network_mode: host` (bắt multicast) + gọi nhau qua
#    host.docker.internal (kèm extra_hosts).
#  - Không dùng profiles. Secrets (JWT, admin, Telegram) điền trong UI Coolify
#    (Environment Variables) thay vì .env.prod.
#  - Ổ HDD/SAN: sửa volumes bên dưới thành bind /mnt/Data... trước khi import,
#    hoặc dùng Persistent Storage trong UI Coolify.
#
# Việc vẫn làm TRÊN HOST qua SSH (Coolify không làm thay):
#  sysctl (scripts/sysctl-vtc.conf), tmpfs (scripts/mount-ramdisk.sh),
#  multicast 239.x, firewall — xem docs/12 §2/§4.

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: vtc-backend:latest
    container_name: vtc-backend
    init: true
    network_mode: "host" # bắt multicast trực tiếp (PRD §11)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      VTC_GC_ENABLE: "1"
    volumes:
      - ramdisk:/media/ramdisk/live
      - captures:/mnt/Data/catchup/captures
      - exports:/mnt/Data/catchup/exports
      - tspconf:/opt/vtc/conf/sources
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: vtc-frontend:latest
    container_name: vtc-frontend
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Frontend (bridge) gọi backend (host net) qua gateway — không dùng
      # tên service vì backend không nằm trong mạng compose.
      VTC_API_ORIGIN: "http://host.docker.internal:8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: vtc-nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ramdisk:/media/ramdisk/live:ro
      - exports:/mnt/Data/catchup/exports:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  ramdisk:
  captures:
  exports:
  tspconf:
