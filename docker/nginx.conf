# Nginx — Cửa vào duy nhất ở Prod: serve HLS + proxy app.
#  - /hls/      → RAMDisk live (static, tắt cache .m3u8, anti-hotlink referer).
#  - /          → Next.js frontend (:3000).
#  - /api/      → backend (:8080, giữ cookie + SSE). Download exports đi qua
#                 API (đã kiểm tra JWT) nên Nginx chỉ proxy, không serve trực tiếp.
#  - /protected-exports/ (internal) → dành cho X-Accel-Redirect khi muốn Nginx
#                 gánh download thay backend (bật bằng cách cho backend trả header
#                 X-Accel-Redirect thay vì pipe stream — code hiện tại pipe trực
#                 tiếp, vẫn chạy tốt sau Nginx).

upstream vtc_frontend { server frontend:3000; }
# Backend ở host network (bắt multicast) nên Nginx gọi qua host gateway,
# không dùng DNS compose. Trên Linux cần container chạy với
# extra_hosts host.docker.internal:host-gateway (đã có trong compose).
upstream vtc_backend { server host.docker.internal:8080; }

# Giới hạn chống hotlink: chỉ domain hệ thống được nhúng HLS.
# Đổi tên miền ở đây khi lên Prod thật.
map $http_referer $hotlink_blocked {
  default 1;
  "~https?://luuchieu.truyenhinhso.vn" 0;
  "~https?://localhost" 0;
  "" 0; # cho phép mở trực tiếp/VLC (không có Referer)
}

# Playlist .m3u8 không cache (luôn tươi), segment cache 5s.
map $request_uri $hls_cache {
  default "public, max-age=5";
  "~*\.m3u8($|\?)" "no-cache";
}

server {
  listen 80;
  server_name _;

  #-- HLS live từ RAMDisk -----------------------------------------------------
  location /hls/ {
    alias /media/ramdisk/live/;
    if ($hotlink_blocked) { return 403; }
    add_header Cache-Control $hls_cache;
    add_header Access-Control-Allow-Origin "https://luuchieu.truyenhinhso.vn";
    expires 5s;
  }

  #-- API backend (giữ nguyên cookie, SSE, streaming download) -----------------
  location /api/ {
    proxy_pass http://vtc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE + download stream: tắt buffer để dữ liệu chảy ngay.
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  #-- X-Accel nội bộ cho exports (backend opt-in sau) --------------------------
  location /protected-exports/ {
    internal;
    alias /mnt/Data/catchup/exports/;
  }

  #-- Frontend ----------------------------------------------------------------
  location / {
    proxy_pass http://vtc_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
