# Demo: serve RAMDisk local để dev xem được HLS mà không cần Nginx Prod.
server {
  listen 80;
  # /hls/<kenh>/index.m3u8 từ ./storage/ramdisk (mount ở compose).
  location /hls/ {
    alias /media/ramdisk/live/;
    add_header Cache-Control no-cache;
    add_header Access-Control-Allow-Origin *;
  }
}
